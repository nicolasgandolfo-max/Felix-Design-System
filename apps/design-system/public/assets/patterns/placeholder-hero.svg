<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 228" width="160" height="228" role="img">
  <!-- Marcador temporal para los heros de patrón que todavía no tienen export
       de Figma. Mismos colores que los tokens del DS (linen, stone, slate) y
       borde punteado para que se lea como pendiente, no como arte final.
       El viewBox es 1:1 con el tamaño al que el header dibuja las láminas
       (160px de ancho), así que el texto se lee sin escalar. -->
  <rect x="1" y="1" width="158" height="226" rx="15" fill="#fefcf9"
        stroke="#082422" stroke-opacity="0.14" stroke-width="2" stroke-dasharray="6 5" />
  <g transform="translate(52 84)" fill="#082422" fill-opacity="0.18">
    <path d="M5 0h46a5 5 0 0 1 5 5v38a5 5 0 0 1-5 5H5a5 5 0 0 1-5-5V5a5 5 0 0 1 5-5Zm0 7v30l14-13 10 9 14-14 9 9V7H5Z" />
    <circle cx="17" cy="16" r="4.5" />
  </g>
  <text x="80" y="156" text-anchor="middle" fill="#082422" fill-opacity="0.55"
        font-family="system-ui, -apple-system, Segoe UI, sans-serif"
        font-size="9" font-weight="600" letter-spacing="1.1">PLACEHOLDER</text>
</svg>
