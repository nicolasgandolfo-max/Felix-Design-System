    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Entrar · Félix Plaza</title>
    <!--
      Única página que se sirve SIN sesión (ver nginx/nginx.conf). Por eso es
      autocontenida: nada de aquí puede depender del bundle del portal ni de
      sus fuentes.

      - El bundle (assets/index-*.js) embebe DESIGN.md y components.md — es el
        contenido que el login protege, así que no puede cargarse acá.
      - Plain y Saans son tipografías con licencia comercial: servirlas sin
        login las expondría a cualquiera. Se usa la pila del sistema.
      - El único script está inline y su hash SHA-256 va en la CSP que nginx
        manda para /login. Si se edita el script, hay que recalcular el hash:
        `npm run login:csp-hash` en apps/design-system lo imprime.
    -->
    <style>
      :root {
        --slate: #082422;
        --slate-600: #234343;
        --turquoise: #2bf2f1;
        --cream: #fefcf9;
        --sand: #efebe7;
        --coral: #b3261e;
        --coral-bg: #fdecea;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: 24px 16px;
        background: var(--cream);
        color: var(--slate);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        width: 100%;
        max-width: 440px;
        padding: 40px 32px 32px;
        background: #fff;
        border: 1px solid var(--sand);
        border-radius: 24px;
        box-shadow: 0 18px 50px -30px rgba(8, 36, 34, 0.35);
      }
      .logo {
        display: block;
        height: 34px;
        width: auto;
        margin-bottom: 32px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 26px;
        line-height: 1.15;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        font-size: 15px;
        line-height: 1.5;
        color: var(--slate-600);
      }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.92em;
        background: var(--sand);
        padding: 1px 6px;
        border-radius: 6px;
        white-space: nowrap;
      }
      .denied {
        margin-top: 20px;
        padding: 12px 14px;
        border-radius: 12px;
        background: var(--coral-bg);
        color: var(--coral);
        font-size: 14px;
        line-height: 1.45;
      }
      .go {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        width: 100%;
        margin-top: 28px;
        padding: 14px 20px;
        border-radius: 9999px;
        background: var(--slate);
        color: #fff;
        font-size: 16px;
        font-weight: 600;
        text-decoration: none;
        transition: background 0.15s ease;
      }
      .go:hover {
        background: var(--slate-600);
      }
      .go:focus-visible {
        outline: 3px solid var(--turquoise);
        outline-offset: 3px;
      }
      .go svg {
        flex: none;
      }
      .foot {
        margin-top: 24px;
        font-size: 12px;
        color: #8a8780;
        text-align: center;
      }
      @media (max-width: 420px) {
        .card {
          padding: 32px 22px 24px;
        }
        h1 {
          font-size: 23px;
        }
      }
    </style>
  </head>

      <h1>Este espacio es del equipo de Félix.</h1>
      <p>
        Entra con tu cuenta de Google de <code>@felixpago.com</code> o
        <code>@ext.felixpago.com</code>.
      </p>

      <div id="denied" class="denied" role="alert" hidden>
        No pudimos iniciar sesión con esa cuenta. Usa tu cuenta
        <code>@felixpago.com</code> o <code>@ext.felixpago.com</code> y vuelve a
        intentarlo.
      </div>

      <!-- Sin JS también funciona: vuelve a la portada después de entrar. -->
      <a id="go" class="go" href="/oauth2/start?rd=%2F">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        Continuar con Google
      </a>

      <p class="foot">Félix Plaza · Sistema de diseño</p>
    </main>

    <script>(function () {
  var q = new URLSearchParams(location.search);
  var rd = q.get("rd") || "/";
  // Solo rutas relativas de este sitio: descarta "//host", "/\host" y esquemas.
  // oauth2-proxy vuelve a validarlo del lado del servidor; esto evita mostrar
  // un botón que apunte afuera.
  if (!/^\/(?![\/\\])/.test(rd)) rd = "/";
  document.getElementById("go").href = "/oauth2/start?rd=" + encodeURIComponent(rd);
  if (q.get("error") === "denied") document.getElementById("denied").hidden = false;
})();</script>
