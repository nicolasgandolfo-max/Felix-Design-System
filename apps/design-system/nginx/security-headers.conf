# Cabeceras comunes a toda respuesta. Van en un include porque nginx NO hereda
# `add_header` dentro de un `location` que declara cabeceras propias: si se
# pusieran una sola vez en `server`, cualquier bloque con su `Cache-Control`
# las perdería en silencio. Cada location hace `include` de este archivo.

# Sitio interno: no indexar (además está detrás del login, esto es refuerzo).
add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;

# No adivinar content-types: un .txt o un SVG nunca se ejecutan como script.
add_header X-Content-Type-Options "nosniff" always;

# Nadie embebe el portal en un iframe (clickjacking). El portal no se embebe
# a sí mismo, así que DENY no rompe nada propio.
add_header X-Frame-Options "DENY" always;

# Al seguir un enlace externo (Figma, Notion) no se filtra la ruta interna,
# solo el origen.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# TLS termina en el ingress, pero la cabecera viaja igual al navegador. Sin
# includeSubDomains a propósito: sólo compromete a plaza.felixpago.com.
add_header Strict-Transport-Security "max-age=31536000" always;

add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
