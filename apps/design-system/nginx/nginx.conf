worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    tcp_nopush    on;
    server_tokens off;

    gzip on;
    gzip_types text/html application/javascript text/css application/json image/svg+xml;

    # oauth2-proxy es un sidecar del mismo pod: sólo se lo alcanza desde acá.
    upstream oauth2_proxy {
        server 127.0.0.1:4180;
    }

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # TLS termina en el ingress, así que nginx ve http. Con redirects
        # absolutos mandaría `Location: http://plaza.felixpago.com/…`. Con
        # relativos, el navegador los resuelve contra el origen https actual.
        absolute_redirect off;

        # ═══════════════════════════════ EL GATE ═══════════════════════════════
        # Deny por defecto: TODA ruta le pregunta a oauth2-proxy antes de
        # servirse. Sin sesión → 401 → @login. Las únicas excepciones son los
        # bloques que dicen `auth_request off` explícitamente, y cada uno dice
        # por qué. Un `location` nuevo queda protegido sin hacer nada.
        auth_request /oauth2/auth;
        error_page 401 = @login;

        # La subrequest de autorización. `internal`: desde afuera es un 404.
        location = /oauth2/auth {
            internal;
            auth_request off;
            proxy_pass http://oauth2_proxy;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Uri $request_uri;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # La página propia de oauth2-proxy sobra: hay una sola puerta, /login.
        location = /oauth2/sign_in {
            auth_request off;
            include /etc/nginx/security-headers.conf;
            return 302 /login$is_args$args;
        }

        # start / callback / sign_out / userinfo. Sin gate: es el login mismo.
        location /oauth2/ {
            auth_request off;
            include /etc/nginx/security-headers.conf;
            proxy_pass http://oauth2_proxy;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Cuenta fuera de los dominios (o CSRF inválido): oauth2-proxy
            # devuelve 403 con su página genérica. Se la cambia por /login con
            # el aviso. Este `error_page` reemplaza al del server a propósito.
            proxy_intercept_errors on;
            error_page 403 = @denied;
        }

        location @login {
            auth_request off;
            include /etc/nginx/security-headers.conf;
            # $request_uri es la URL original aunque try_files haya redirigido
            # internamente a /index.html: la persona vuelve a donde iba.
            return 302 /login?rd=$request_uri;
        }

        location @denied {
            auth_request off;
            include /etc/nginx/security-headers.conf;
            return 302 /login?error=denied;
        }

        # La única HTML sin sesión. Autocontenida (ver public/login/index.html).
        # CSP estricta: sólo SU script inline, por hash; estilos inline; imágenes
        # propias; nada más. Si se edita el script, el hash cambia:
        # `npm run login:csp-hash -- --write` en apps/design-system lo actualiza,
        # y el Dockerfile falla el build si no coinciden.
        location = /login {
            auth_request off;
            include /etc/nginx/security-headers.conf;
            add_header Content-Security-Policy "default-src 'none'; script-src 'sha256-DXTnvyIHu5Kkn0+IBjNWD+WBBIzRRPEIa3LUfYKjLss='; style-src 'unsafe-inline'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
            add_header Cache-Control "no-store" always;
            try_files /login/index.html =404;
        }

        # El kubelet lo sondea contra el contenedor, sin cookie.
        location = /healthz {
            auth_request off;
            access_log off;
            return 200 "ok";
            add_header Content-Type text/plain;
            add_header X-Robots-Tag "noindex, nofollow" always;
        }

        # El navegador los pide ANTES de que haya sesión (pestaña de /login) y
        # no cuentan nada. Va antes de la regex de extensiones: en nginx gana la
        # primera regex que matchea.
        location ~ ^/(favicon\.svg|favicon\.ico|apple-touch-icon\.png|robots\.txt)$ {
            auth_request off;
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "public, max-age=86400";
            try_files $uri =404;
        }

        # ══════════════════════════ contenido protegido ══════════════════════════
        # `private`: el bundle embebe DESIGN.md y components.md — un caché
        # compartido en el camino no debe guardarlo para otro cliente.

        # Chunks con hash de Vite — seguros de cachear para siempre.
        location ^~ /assets/ {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "private, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # Estáticos de `public/` (fuentes, banderas, ilustraciones, iconos). Sin
        # hash en el nombre, así que revalidan en vez de cachearse a un año.
        # Las fuentes de la marca son .otf con licencia comercial: por eso están
        # detrás del gate y no en la lista pública de arriba.
        location ~* \.(?:otf|ttf|woff2?|svg|png|jpg|jpeg|gif|ico|webp)$ {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "private, max-age=604800";
            try_files $uri =404;
        }

        # SPA: las rutas las resuelve React Router; lo que no es archivo cae en
        # index.html. `no-store`: al cerrar sesión, "atrás" no muestra contenido
        # cacheado. El redirect interno vuelve a pasar por el gate.
        location / {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-store";
            try_files $uri $uri/ /index.html;
        }
    }
}
